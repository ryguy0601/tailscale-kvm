[package]
name = "tailscale-kvm-receiver"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Cuccurullo <ryguy0601@gmail.com>"]
description = "Universal cross-platform Rust receiver daemon for Tailscale KVM (Linux, Windows, macOS)"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.12", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
] }
