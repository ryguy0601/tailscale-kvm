[package]
name = "tailscale-kvm-host"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Cuccurullo <ryguy0601@gmail.com>"]
description = "Universal cross-platform Rust host controller for Tailscale KVM (Windows, Linux, macOS)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
